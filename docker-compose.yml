# HRL Books platform. Own volumes, separate from other portfolio projects (spec 8.5).
# Secrets come from .env next to this file (see .env.example) — never committed.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrl_books
      POSTGRES_USER: hrl_books
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - hrl_books_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrl_books -d hrl_books"]
      interval: 10s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://hrl_books:${POSTGRES_PASSWORD}@db:5432/hrl_books
    ports:
      - "127.0.0.1:${API_PORT:-8110}:8000"
    volumes:
      - hrl_books_files:/app/data

volumes:
  hrl_books_db:
  hrl_books_files:
